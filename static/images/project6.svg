      <text x="30" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#16A34A" font-weight="600">LCP: 0.5s (Good)</text>

      <rect x="165" y="45" width="130" height="26" rx="6" fill="#F0FDF4"/>
      <text x="175" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#16A34A" font-weight="600">FID: 12ms (Good)</text>

      <rect x="310" y="45" width="130" height="26" rx="6" fill="#F0FDF4"/>
      <text x="320" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#16A34A" font-weight="600">CLS: 0.00 (Good)</text>
