<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="24" fill="url(#bgP5)"/>

  <g transform="translate(40, 35)">
    <rect width="520" height="310" rx="16" fill="#0F172A"/>
    
    <!-- Top Bar -->
    <rect width="520" height="42" rx="16" fill="#1E293B"/>
    <path d="M0 26 H520 V42 H0 Z" fill="#1E293B"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <text x="80" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">🤖 NexusChat Multi-Agent Hub</text>

    <!-- Agent Switcher Pills -->
    <g transform="translate(20, 56)">
      <rect width="105" height="26" rx="13" fill="#7C3AED"/>
      <text x="52.5" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">⚡ Code Agent</text>

      <g transform="translate(115, 0)">
        <rect width="115" height="26" rx="13" fill="#334155"/>
        <text x="57.5" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">🔍 Research Bot</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="110" height="26" rx="13" fill="#334155"/>
        <text x="55" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">✍️ Writer AI</text>
      </g>
    </g>

    <!-- Chat Stream Area -->
    <g transform="translate(20, 95)">
      <rect width="480" height="150" rx="10" fill="#1E293B"/>

      <!-- User prompt -->
      <g transform="translate(220, 15)">
        <rect width="245" height="30" rx="8" fill="#7C3AED"/>
        <text x="12" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#FFFFFF">Optimize this Flask SQLAlchemy query</text>
      </g>

      <!-- Code Agent response -->
      <g transform="translate(15, 55)">
        <rect width="450" height="80" rx="8" fill="#0F172A" stroke="#334155"/>
        <text x="12" y="20" font-family="monospace" font-size="10" fill="#38BDF8">def get_users_cached():</text>
        <text x="24" y="38" font-family="monospace" font-size="10" fill="#94A3B8">  return User.query.options(joinedload(User.roles)).all()</text>
        <text x="12" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#10B981">✓ Reduced query count from N+1 to 1 single JOIN.</text>
      </g>
    </g>

    <!-- Prompt Input bar -->
    <g transform="translate(20, 255)">
      <rect width="480" height="38" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748B">Type a prompt or ask Code Agent...</text>
      <rect x="420" y="6" width="50" height="26" rx="6" fill="#7C3AED"/>
      <text x="445" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Send</text>
    </g>
  </g>
</svg>
