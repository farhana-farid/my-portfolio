        <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#2563EB" font-weight="600">AUTO-TAG ACCURACY</text>
        <text x="14" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F172A">98.4%</text>
