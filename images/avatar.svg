<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="50%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="80" cy="90" r="45" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="340" cy="300" r="60" fill="#7C3AED" opacity="0.12"/>
  <circle cx="320" cy="70" r="25" fill="#4C1D95" opacity="0.15"/>

  <!-- Character / Avatar Silhouette & Tech Aesthetics -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Base Body Silhouette -->
    <path d="M 60,330 C 60,250 110,210 160,210 C 210,210 260,250 260,330 Z" fill="url(#accentGrad)"/>
    
    <!-- White Inner Collar -->
    <path d="M 135,210 L 160,250 L 185,210 Z" fill="#FFFFFF"/>
    
    <!-- Neck -->
    <rect x="145" y="170" width="30" height="45" rx="6" fill="#FCD34D"/>
    
    <!-- Face -->
    <ellipse cx="160" cy="140" rx="55" ry="65" fill="#FDE68A"/>
    
    <!-- Hair Front & Side Locks -->
    <path d="M 105,140 C 95,90 120,50 160,50 C 200,50 225,90 215,140 C 215,100 185,85 160,85 C 135,85 105,100 105,140 Z" fill="url(#hairGrad)"/>
    <path d="M 102,130 C 100,160 110,185 118,195 C 114,175 110,150 110,130 Z" fill="url(#hairGrad)"/>
    <path d="M 218,130 C 220,160 210,185 202,195 C 206,175 210,150 210,130 Z" fill="url(#hairGrad)"/>
    
    <!-- Modern Tech Glasses -->
    <rect x="120" y="125" width="32" height="24" rx="7" fill="none" stroke="#4C1D95" stroke-width="4"/>
    <rect x="168" y="125" width="32" height="24" rx="7" fill="none" stroke="#4C1D95" stroke-width="4"/>
    <line x1="152" y1="137" x2="168" y2="137" stroke="#4C1D95" stroke-width="4"/>
    <!-- Glasses Reflection -->
    <path d="M 125,130 L 135,130" stroke="#DDD6FE" stroke-width="2" stroke-linecap="round"/>
    <path d="M 173,130 L 183,130" stroke="#DDD6FE" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Friendly Smile -->
    <path d="M 148,172 Q 160,182 172,172" fill="none" stroke="#B45309" stroke-width="3" stroke-linecap="round"/>

    <!-- Subtle AI Star Badge -->
    <polygon points="160,265 164,275 174,275 166,281 169,291 160,285 151,291 154,281 146,275 156,275" fill="#FBBF24"/>
  </g>

  <!-- Floating Badge: AI & Web -->
  <g transform="translate(240, 40)">
    <rect width="130" height="36" rx="18" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="20" cy="18" r="8" fill="#10B981"/>
    <text x="36" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0F172A">Open to Work</text>
  </g>
</svg>
