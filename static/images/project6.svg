<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="24" fill="url(#bgP6)"/>

  <g transform="translate(40, 35)">
    <rect width="520" height="310" rx="16" fill="#FAF9FF"/>
    
    <!-- Top Bar -->
    <rect width="520" height="42" rx="16" fill="#FFFFFF"/>
    <path d="M0 26 H520 V42 H0 Z" fill="#FFFFFF"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <text x="80" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A">⚡ Lighthouse 100/100 Benchmark</text>

    <!-- 4 Score Circles -->
    <g transform="translate(40, 65)">
      <!-- Score 1: Performance -->
      <g transform="translate(0, 0)">
        <circle cx="45" cy="45" r="35" fill="none" stroke="#DCFCE7" stroke-width="6"/>
        <circle cx="45" cy="45" r="35" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="220" stroke-dashoffset="0"/>
        <text x="45" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#16A34A" text-anchor="middle">100</text>
        <text x="45" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Performance</text>
      </g>

      <!-- Score 2: Accessibility -->
      <g transform="translate(115, 0)">
        <circle cx="45" cy="45" r="35" fill="none" stroke="#DCFCE7" stroke-width="6"/>
        <circle cx="45" cy="45" r="35" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="220" stroke-dashoffset="0"/>
        <text x="45" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#16A34A" text-anchor="middle">100</text>
        <text x="45" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Accessibility</text>
      </g>

      <!-- Score 3: Best Practices -->
      <g transform="translate(230, 0)">
        <circle cx="45" cy="45" r="35" fill="none" stroke="#DCFCE7" stroke-width="6"/>
        <circle cx="45" cy="45" r="35" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="220" stroke-dashoffset="0"/>
        <text x="45" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#16A34A" text-anchor="middle">100</text>
        <text x="45" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">Best Practices</text>
      </g>

      <!-- Score 4: SEO -->
      <g transform="translate(345, 0)">
        <circle cx="45" cy="45" r="35" fill="none" stroke="#DCFCE7" stroke-width="6"/>
        <circle cx="45" cy="45" r="35" fill="none" stroke="#16A34A" stroke-width="6" stroke-dasharray="220" stroke-dashoffset="0"/>
        <text x="45" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#16A34A" text-anchor="middle">100</text>
        <text x="45" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0F172A" text-anchor="middle">SEO</text>
