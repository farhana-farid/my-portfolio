<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cardGlow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <filter id="p1Shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="600" height="380" rx="24" fill="url(#bgP1)"/>

  <!-- Ambient background glow elements -->
  <circle cx="500" cy="80" r="140" fill="#7C3AED" opacity="0.4"/>
  <circle cx="80" cy="300" r="100" fill="#2E1065" opacity="0.6"/>

  <!-- Main App Window Mockup -->
  <g transform="translate(40, 35)" filter="url(#p1Shadow)">
    <!-- Window Frame -->
    <rect width="520" height="310" rx="16" fill="url(#cardGlow1)"/>
    
    <!-- Window Header -->
    <rect width="520" height="42" rx="16" fill="#F8FAFC"/>
    <path d="M0 26 H520 V42 H0 Z" fill="#F8FAFC"/>
    <line x1="0" y1="42" x2="520" y2="42" stroke="#EDE9FE" stroke-width="1.5"/>

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>

    <!-- App Title in Header -->
    <rect x="200" y="14" width="120" height="14" rx="7" fill="#EDE9FE"/>
    <text x="260" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle">InsightAI • Doc Summary</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="130" height="268" rx="0" fill="#FAF9FF"/>
    <line x1="130" y1="42" x2="130" y2="310" stroke="#EDE9FE" stroke-width="1.5"/>

    <!-- Sidebar Items -->
    <rect x="15" y="60" width="100" height="22" rx="6" fill="#EDE9FE"/>
    <text x="35" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#6D28D9">📄 Annual_Report.pdf</text>
    
    <rect x="15" y="90" width="100" height="20" rx="6" fill="transparent"/>
    <text x="35" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#64748B">📑 AI_Research.docx</text>

    <rect x="15" y="118" width="100" height="20" rx="6" fill="transparent"/>
    <text x="35" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#64748B">📊 Tech_Trends.txt</text>

    <!-- Content Area: AI Summary Card -->
    <g transform="translate(150, 58)">
      <rect width="350" height="120" rx="12" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1"/>
      <rect x="15" y="15" width="140" height="16" rx="8" fill="#EDE9FE"/>
      <text x="85" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#7C3AED" text-anchor="middle">✨ Executive Summary</text>
      
      <!-- Bullet Points -->
      <circle cx="20" cy="50" r="3" fill="#7C3AED"/>
      <rect x="30" y="46" width="280" height="8" rx="4" fill="#E2E8F0"/>

      <circle cx="20" cy="72" r="3" fill="#7C3AED"/>
      <rect x="30" y="68" width="250" height="8" rx="4" fill="#E2E8F0"/>

      <circle cx="20" cy="94" r="3" fill="#7C3AED"/>
      <rect x="30" y="90" width="220" height="8" rx="4" fill="#E2E8F0"/>
    </g>

    <!-- Content Area: Interactive Chat Box -->
    <g transform="translate(150, 190)">
      <rect width="350" height="105" rx="12" fill="#FAF9FF" stroke="#EDE9FE" stroke-width="1"/>
      
      <!-- User Query Bubble -->
      <g transform="translate(130, 12)">
        <rect width="205" height="26" rx="8" fill="#7C3AED"/>
        <text x="12" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#FFFFFF">What were the key Q3 results?</text>
      </g>

      <!-- AI Response Bubble -->
      <g transform="translate(15, 46)">
        <rect width="280" height="34" rx="8" fill="#FFFFFF" stroke="#EDE9FE" stroke-width="1"/>
        <text x="12" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#0F172A">🤖 28% increase in revenue with 99.4% uptime.</text>
        <rect x="12" y="24" width="180" height="4" rx="2" fill="#EDE9FE"/>
      </g>

      <!-- Input Bar -->
      <rect x="15" y="86" width="280" height="12" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="25" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94A3B8">Ask anything about this document...</text>
      <circle cx="310" cy="92" r="8" fill="#7C3AED"/>
      <path d="M308 92 L312 90 L312 94 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
